[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 글꼴, 빌드된 자바스크립트/CSS는 오래 캐시
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# 2028년 운세를 없애면서 옛 주소는 2027년으로 보냄
[[redirects]]
  from = "/zodiac/2028/*"
  to = "/zodiac/2027/:splat"
  status = 301

[[redirects]]
  from = "/guide/year-2027-2028/"
  to = "/guide/year-2027/"
  status = 301
